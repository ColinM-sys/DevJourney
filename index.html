<style>
:root {

  --border: #1e1e3a;
  --primary: #76b900;
  --accent: #7c3aed;
  --accent2: #3b82f6;
  --text: #e2e8f0;
  --dim: #94a3b8;
  --muted: #475569;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.header {
  background: linear-gradient(135deg, #12122a, #1a1040);
  border-bottom: 1px solid var(--border);
  padding: 1.5rem 2rem;
  text-align: center;
}
.header h1 { font-size: 1.8rem; background: linear-gradient(135deg, #76b900, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header .subtitle { color: var(--dim); font-size: 0.9rem; margin-top: 4px; }

.stats-bar {
  display: flex; gap: 1.5rem; justify-content: center; padding: 1rem 2rem;
  flex-wrap: wrap;
}
.stat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 1rem 1.5rem; text-align: center; min-width: 140px;
}
.stat-card .value { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
.stat-card .label { font-size: 0.75rem; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; padding: 1.5rem 2rem; max-width: 1400px; margin: 0 auto; }
.full-width { grid-column: 1 / -1; }

.panel {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem;
}
.panel h2 { font-size: 1.1rem; color: var(--accent); margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }

/* Skill bars */
.skill-group { margin-bottom: 1.2rem; }
.skill-group-title { font-size: 0.8rem; color: var(--accent2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
.skill-row { display: flex; align-items: center; margin-bottom: 6px; gap: 10px; }
.skill-name { width: 160px; font-size: 0.85rem; color: var(--dim); flex-shrink: 0; }
.skill-bar-bg { flex: 1; height: 20px; background: #1a1a30; border-radius: 10px; overflow: hidden; position: relative; }
.skill-bar { height: 100%; border-radius: 10px; transition: width 1.5s ease-out; position: relative; }
.skill-bar::after { content: attr(data-level); position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 0.7rem; color: white; font-weight: 600; }
.skill-level { width: 30px; font-size: 0.75rem; color: var(--dim); text-align: right; }

/* Timeline */
.timeline { position: relative; padding-left: 30px; }
.timeline::before { content: ''; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, var(--primary), var(--accent), var(--accent2)); }
.timeline-item { position: relative; margin-bottom: 1.2rem; padding-left: 20px; }
.timeline-item::before {
  content: ''; position: absolute; left: -24px; top: 4px; width: 12px; height: 12px;
  border-radius: 50%; border: 2px solid var(--primary); background: var(--bg);
}
.timeline-item.predicted::before { border-color: var(--muted); border-style: dashed; }
.timeline-item .date { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.timeline-item .event { font-size: 0.85rem; color: var(--text); margin-top: 2px; }
.timeline-item .detail { font-size: 0.75rem; color: var(--dim); margin-top: 2px; }
.timeline-item.predicted .event { color: var(--muted); font-style: italic; }

/* Predicted */
.prediction-card {
  background: linear-gradient(135deg, #1a1030, #0f1a30); border: 1px dashed var(--accent);
  border-radius: 10px; padding: 1rem; margin-bottom: 0.8rem;
}
.prediction-card .title { font-size: 0.9rem; color: var(--accent); font-weight: 600; }
.prediction-card .why { font-size: 0.78rem; color: var(--dim); margin-top: 4px; }
.prediction-card .confidence { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }
.conf-bar { height: 4px; background: #1a1a30; border-radius: 2px; margin-top: 4px; }
.conf-fill { height: 100%; border-radius: 2px; background: var(--accent); }

/* Category filter */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
.filter-btn {
  padding: 4px 12px; border-radius: 16px; border: 1px solid var(--border);
  background: transparent; color: var(--dim); font-size: 0.75rem; cursor: pointer;
  transition: all 0.2s;
}
.filter-btn:hover, .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

/* XP animation */
@keyframes xp-glow { 0%,100% { box-shadow: 0 0 5px #76b90033; } 50% { box-shadow: 0 0 15px #76b90066; } }
.stat-card:first-child { animation: xp-glow 3s infinite; }

@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
</style>

// ═══════════════════════════════════════════════════════════
// PERCENTILE MODEL — Hybrid of SO 2024 Survey, GitHub Octoverse 2024,
// LinkedIn Economic Graph / Burning Glass skill data
//
// Sources:
//   - Stack Overflow Annual Developer Survey 2024 (survey.stackoverflow.co)
//     Tech adoption rates, experience distribution, language counts
//   - GitHub Octoverse 2024 (github.blog/octoverse)
//     Avg repos/user, languages/user, contribution patterns
//   - LinkedIn/Burning Glass aggregate skill data
//     Skill counts by seniority tier, category coverage patterns
//
// Average dev (50th %ile): 4-5 languages, 3-4 categories, ~170 weighted pts
//   Knows JS or Python + SQL + one framework + basic Docker
//   SO: 62% know JS, 51% Python, 59% Docker, 20% K8s, 15% ML
//   GitHub: median 4 repos, 3-4 languages
//   LinkedIn: mid-level lists 6-12 skills across 2-4 categories
//
// Tier     | Categories | Score  | Percentile | SO/LinkedIn basis
// ---------|-----------|--------|------------|------------------
// Beginner | 1-2       | 0-50   | 0-20th    | 15% are 0-2yr exp
// Junior   | 2-3       | 51-120 | 21-40th   | basic web + 1 lang
// Mid      | 3-5       | 121-250| 41-65th   | 25% are 2-5yr
// Senior   | 5-8       | 251-450| 66-85th   | 25% are 5-10yr, 4-6 cats
// Staff+   | 7-12      | 451-700| 86-95th   | 10+ yr, breadth + arch
// Top 1%   | 10-16     | 701+   | 96-100th  | principal/distinguished
// ═══════════════════════════════════════════════════════════

// Calibrated against 69-skill test with difficulty weights.
// Max possible: ~11,000. Average dev (SO survey median): ~400.
// Senior (5-10yr, 4-6 categories deep): ~1,500-2,500
// Staff (10+yr, 7-12 categories): ~3,000-5,000
// Distinguished (rare, 10-16 categories deep): ~5,000-8,000
const PERCENTILE_TABLE = [
  [0, 0], [100, 10], [200, 20], [300, 30], [400, 50],  // 400 = median (avg dev)
  [600, 60], [1000, 70], [1500, 75], [2000, 80],
  [2500, 85], [3500, 90], [5000, 95], [7000, 98], [9000, 99], [11000, 100]
];

function calcWeightedScore() {
  return skills.reduce((sum, s) => {
    const w = difficultyWeights[s.name] || 1.0;
    return sum + (s.level * w);
  }, 0);
}

function calcPercentile(score) {
  for (let i = 1; i < PERCENTILE_TABLE.length; i++) {
    const [s0, p0] = PERCENTILE_TABLE[i - 1];
    const [s1, p1] = PERCENTILE_TABLE[i];
    if (score <= s1) {
      const t = (score - s0) / (s1 - s0);
      return Math.round(p0 + t * (p1 - p0));
    }
  }
  return 99;
}

function calcBreadth() {
  // How many of the 16 categories have at least one skill >= 20?
  const activeCats = new Set(skills.filter(s => s.level >= 20).map(s => s.category));
  return activeCats.size;
}

function calcDepth() {
  // Average of your top 5 skill levels
  const sorted = [...skills].sort((a, b) => b.level - a.level);
  return Math.round(sorted.slice(0, 5).reduce((s, sk) => s + sk.level, 0) / 5);
}

function getTier(percentile) {
  if (percentile >= 96) return { name: "Distinguished", color: "#ffd700", icon: "★★★★★" };
  if (percentile >= 86) return { name: "Staff / Principal", color: "#76b900", icon: "★★★★" };
  if (percentile >= 66) return { name: "Senior", color: "#3b82f6", icon: "★★★☆" };
  if (percentile >= 41) return { name: "Mid-Level", color: "#a78bfa", icon: "★★★" };
  if (percentile >= 21) return { name: "Junior", color: "#f59e0b", icon: "★★" };
  return { name: "Beginner", color: "#ef4444", icon: "★" };
}

  const weightedScore = calcWeightedScore();
  const percentile = calcPercentile(weightedScore);
  const tier = getTier(percentile);
  const breadth = calcBreadth();
  const depth = calcDepth();
  const avgDiffWeight = (skills.reduce((s, sk) => s + (difficultyWeights[sk.name] || 1.0), 0) / skills.length).toFixed(1);
  const months = 3.5; // Jan 2026 to mid-Apr 2026 — actual coding time (Oct-Dec was exploration)

// Skill bars
function renderSkillBars() {
  const filtered = activeFilter === 'All' ? skills : skills.filter(s => s.category === activeFilter);
  const grouped = {};
  filtered.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });

  let html = '';
  for (const [cat, items] of Object.entries(grouped)) {
    items.sort((a, b) => b.level - a.level);
    html += `<div class="skill-group"><div class="skill-group-title">${cat}</div>`;
    items.forEach(s => {
      const w = difficultyWeights[s.name] || 1.0;
      const wLabel = w >= 2.0 ? `<span style="color:#f59e0b;font-size:0.65rem;margin-left:4px;">${w}x</span>` : `<span style="color:var(--muted);font-size:0.65rem;margin-left:4px;">${w}x</span>`;
      html += `
        <div class="skill-row">
          <span class="skill-name">${s.name}${wLabel}</span>
          <div class="skill-bar-bg">
            <div class="skill-bar" data-level="Lv ${s.level}" style="width:0%;background:${s.color}"></div>
          </div>
          <span class="skill-level">${s.level}</span>
        </div>`;
    });
    html += '</div>';
  }
  document.getElementById('skillBars').innerHTML = html;

  // Animate bars
  requestAnimationFrame(() => {
    document.querySelectorAll('.skill-bar').forEach(bar => {
      const level = parseInt(bar.dataset.level.replace('Lv ', ''));
      bar.style.width = level + '%';
    });
  });
}

// Velocity chart
function renderVelocityChart() {
  // Count skills learned per month — filter out nulls (level 0 skills)
  const monthly = {};
  skills.forEach(s => {
    if (!s.learned) return; // skip null/unlearned
    if (!monthly[s.learned]) monthly[s.learned] = 0;
    monthly[s.learned]++;
  });
  const sorted = Object.entries(monthly).sort((a, b) => a[0].localeCompare(b[0]));

  // Calculate average monthly velocity from real data
  const totalNew = sorted.reduce((s, [, c]) => s + c, 0);
  const avgPerMonth = totalNew / sorted.length;

  // Cumulative from real data
  let cumulative = 0;
  const cumData = sorted.map(([m, c]) => { cumulative += c; return cumulative; });
  const lastCum = cumulative;

  // --- Predictions ---
  // 1-2 months out (May-Jun 2026): maintain current velocity
  // 4-6 months out (Aug-Oct 2026): slight slowdown as you deepen vs broaden
  // 1 year out (Apr 2027): shift to depth over breadth
  const predictions = [
    { label: "Jun 2026 (projected)", newPerMonth: Math.round(avgPerMonth * 0.9), months: 2 },
    { label: "Oct 2026 (projected)", newPerMonth: Math.round(avgPerMonth * 0.6), months: 4 },
    { label: "Apr 2027 (projected)", newPerMonth: Math.round(avgPerMonth * 0.35), months: 6 },
  ];

  const allLabels = sorted.map(([m]) => m);
  const allCum = [...cumData];
  const allNew = sorted.map(([, c]) => c);
  const allNewColors = sorted.map(() => 'rgba(124, 58, 237, 0.3)');
  const allCumColors = cumData.map(() => '#76b900');

  let runningCum = lastCum;
  predictions.forEach(p => {
    const totalNewInPeriod = p.newPerMonth * p.months;
    runningCum += totalNewInPeriod;
    allLabels.push(p.label);
    allCum.push(runningCum);
    allNew.push(p.newPerMonth);
    allNewColors.push('rgba(124, 58, 237, 0.12)');
  });

  // Build point styles — solid for real, hollow for predicted
  const realCount = sorted.length;
  const cumPointBg = cumData.map(() => '#76b900').concat(predictions.map(() => 'transparent'));
  const cumBorderColors = cumData.map(() => '#76b900').concat(predictions.map(() => '#76b90088'));
  const cumSegment = { borderDash: (ctx) => ctx.p0DataIndex >= realCount - 1 ? [6, 3] : undefined };

  new Chart(document.getElementById('velocityChart'), {
    type: 'line',
    data: {
      labels: allLabels,
      datasets: [
        {
          label: 'Cumulative Skills',
          data: allCum,
          borderColor: '#76b900',
          backgroundColor: 'rgba(118, 185, 0, 0.1)',
          fill: true,
          tension: 0.3,
          yAxisID: 'y',
          segment: cumSegment,
          pointBackgroundColor: cumPointBg,
          pointBorderColor: cumBorderColors,
          pointRadius: 5,
        },
        {
          label: 'New Skills / Month',
          data: allNew,
          borderColor: '#7c3aed',
          backgroundColor: allNewColors,
          type: 'bar',
          yAxisID: 'y1'
        }
      ]
    },
    options: {
      responsive: true,
      scales: {
        x: { grid: { color: '#1e1e3a' }, ticks: { color: (ctx) => ctx.index >= realCount ? '#94a3b866' : '#94a3b8' } },
        y: { position: 'left', grid: { color: '#1e1e3a' }, ticks: { color: '#76b900' }, title: { display: true, text: 'Cumulative', color: '#76b900' } },
        y1: { position: 'right', grid: { display: false }, ticks: { color: '#7c3aed' }, title: { display: true, text: 'Per Month', color: '#7c3aed' } }
      },
      plugins: { legend: { labels: { color: '#94a3b8' } } }
    }
  });
}

    name: s.name, level: s.level,
    weight: difficultyWeights[s.name] || 1.0,
    weighted: s.level * (difficultyWeights[s.name] || 1.0),
    category: s.category,

  const top10 = skillWeighted.slice(0, 10);

  const weightedScore = calcWeightedScore();
  const percentile = calcPercentile(weightedScore);
  const tier = getTier(percentile);
  const breadth = calcBreadth();
  const depth = calcDepth();
  const months = 3.5; // Jan 2026 to mid-Apr 2026 — actual coding time (Oct-Dec was exploration)
  const repoCount = repos.length;
  const aiSkills = skills.filter(s => s.category === 'AI / ML').length;
  const totalSkills = skills.length;

  // Determine estimated titles based on score profile
  const titles = [];
  const catAvgs = {};
  // Average only skills you actually have (level > 0), not zeros
  categories.forEach(c => {
    const items = skills.filter(s => s.category === c && s.level > 0);
    catAvgs[c] = items.length ? Math.round(items.reduce((s, i) => s + i.level, 0) / items.length) : 0;
  });

  if (catAvgs['AI / ML'] >= 25) titles.push('AI/ML Engineer');
  if (catAvgs['Backend'] >= 30 && catAvgs['Frontend'] >= 25) titles.push('Full-Stack Developer');
  else if (catAvgs['Backend'] >= 30) titles.push('Backend Developer');
  if (catAvgs['Data Engineering'] >= 25) titles.push('Data Engineer');
  if (catAvgs['Integrations'] >= 25) titles.push('Integration Specialist');
  if (catAvgs['DevOps / Infra'] >= 25) titles.push('DevOps Practitioner');
  if (breadth >= 8) titles.push('Solution Architect');

  // Seniority estimate
  let seniority, seniorityDetail, yearsEquiv, salary;
  if (percentile >= 96) {
    seniority = 'Distinguished / Principal';
    seniorityDetail = 'Deep expertise across 10+ domains, defines technical direction for orgs';
    yearsEquiv = '12+ years typical';
    salary = '$200K-$350K+';
  } else if (percentile >= 86) {
    seniority = 'Staff Engineer';
    seniorityDetail = 'Designs systems across teams, deep multi-domain expertise, mentors seniors';
    yearsEquiv = '8-12 years typical';
    salary = '$160K-$250K';
  } else if (percentile >= 66) {
    seniority = 'Senior Engineer';
    seniorityDetail = 'Owns complex systems end-to-end, ships independently, growing architectural sense';
    yearsEquiv = '5-10 years typical';
    salary = '$130K-$180K';
  } else if (percentile >= 41) {
    seniority = 'Mid-Level Engineer';
    seniorityDetail = 'Builds and ships features independently, solid in 2-4 categories. ' + (breadth >= 6 ? 'Breadth across ' + breadth + ' categories is unusual — most mid-levels cover 3-5.' : '');
    yearsEquiv = '2-5 years typical';
    salary = '$90K-$140K';
  } else if (percentile >= 21) {
    seniority = 'Junior Engineer';
    seniorityDetail = 'Building fundamentals, productive with guidance, 1-3 categories';
    yearsEquiv = '0-2 years typical';
    salary = '$60K-$95K';
  } else {
    seniority = 'Entry / Beginner';
    seniorityDetail = 'Learning basics, following tutorials';
    yearsEquiv = '<1 year typical';
    salary = '$45K-$65K';
  }

  // Strengths and gaps
  const strengths = [];
  const gaps = [];

  if (aiSkills >= 6) strengths.push('Deep AI/ML toolkit — fine-tuning, RAG, voice pipelines, agent frameworks');
  if (breadth >= 5) strengths.push('Rare breadth — most devs at this stage know 2-3 domains, you cover ' + breadth);
  if (repoCount >= 12) strengths.push('Shipping velocity — ' + repoCount + ' repos in ' + months + ' months including a hackathon win');
  if (catAvgs['Integrations'] >= 55) strengths.push('Real-world integration — Twilio, Discord, NYC Open Data, not just tutorials');

  if (catAvgs['Frontend'] < 55) gaps.push('Frontend frameworks (React/Vue) — you build everything in vanilla JS which is harder to maintain at scale');
  if (!skills.find(s => s.name.includes('Docker') && s.level >= 50)) gaps.push('Containerization — Docker basics but not yet production-level');
  if (!skills.find(s => s.name.includes('WebSocket') && s.level >= 50)) gaps.push('Real-time communication — WebSockets/SSE still emerging');
  gaps.push('Testing/CI — no automated testing or deployment pipelines yet');
  gaps.push('Presentation skills — strong builds, but hackathon results show the pitch needs work');

  document.getElementById('profileCard').innerHTML = `
    <div>
      <div style="background:linear-gradient(135deg,#1a1040,#0f1a30);border:1px solid ${tier.color}44;border-radius:12px;padding:1.5rem;">
        <div style="font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;">Estimated Seniority</div>
        <div style="font-size:1.6rem;font-weight:700;color:${tier.color};margin:6px 0;">${seniority}</div>
        <div style="font-size:0.82rem;color:var(--dim);line-height:1.5;">${seniorityDetail}</div>
        <div style="margin-top:12px;display:flex;gap:1rem;flex-wrap:wrap;">
          <div style="background:#0f0f20;padding:8px 14px;border-radius:8px;">
            <div style="font-size:0.65rem;color:var(--muted);">Experience Equiv.</div>
            <div style="font-size:0.9rem;color:var(--text);font-weight:600;">${yearsEquiv}</div>
          </div>
          <div style="background:#0f0f20;padding:8px 14px;border-radius:8px;">
            <div style="font-size:0.65rem;color:var(--muted);">Market Range</div>
            <div style="font-size:0.9rem;color:var(--primary);font-weight:600;">${salary}</div>
          </div>
          <div style="background:#0f0f20;padding:8px 14px;border-radius:8px;">
            <div style="font-size:0.65rem;color:var(--muted);">Actual Time Coding</div>
            <div style="font-size:0.9rem;color:var(--accent);font-weight:600;">~${months} months</div>
          </div>
        </div>
      </div>
      <div style="margin-top:1rem;">
        <div style="font-size:0.8rem;color:var(--accent2);font-weight:600;margin-bottom:6px;">Best-fit Titles</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${titles.map(t => `<span style="padding:4px 10px;background:#1a1040;border:1px solid var(--accent);border-radius:12px;font-size:0.75rem;color:var(--accent);">${t}</span>`).join('')}
        </div>
      </div>
    </div>
    <div>
      <div style="margin-bottom:1rem;">
        <div style="font-size:0.8rem;color:var(--primary);font-weight:600;margin-bottom:8px;">Strengths</div>
        ${strengths.map(s => `<div style="font-size:0.78rem;color:var(--dim);margin-bottom:6px;padding-left:12px;border-left:2px solid var(--primary);">${s}</div>`).join('')}
      </div>
      <div>
        <div style="font-size:0.8rem;color:var(--warning);font-weight:600;margin-bottom:8px;">Growth Areas</div>
        ${gaps.map(g => `<div style="font-size:0.78rem;color:var(--dim);margin-bottom:6px;padding-left:12px;border-left:2px solid var(--warning);">${g}</div>`).join('')}
      </div>
      <div style="margin-top:1rem;padding:10px;background:#0f0f20;border-radius:8px;font-size:0.72rem;color:var(--muted);line-height:1.6;">
        <b style="color:var(--dim);">Note:</b> This profile is estimated from project output, GitHub repos, and skill progression. Seniority equivalence is based on what you can independently build and ship — not years of employment. Your ${months}-month ramp from zero to shipping RAG-powered multi-channel dispatch platforms is significantly faster than average career progression.
      </div>
    </div>
  `;
}

// Init
renderProfile();
renderScoreBreakdown();
renderRepos();
renderStats();
renderFilters();
renderSkillBars();
renderTimeline();
renderPredictions();
renderRadarChart();
renderVelocityChart();
</script>
</body>
</html>
